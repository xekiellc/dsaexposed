<style>
  .own-words-hero {
    padding: 64px 24px 40px;
    max-width: 880px;
    margin: 0 auto;
    text-align: left;
    border-bottom: 1px solid rgba(10,9,6,0.15);
  }

  .own-words-hero .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #B80000;
    margin-bottom: 14px;
  }

  .own-words-hero h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: clamp(32px, 5vw, 52px);
    line-height: 1.08;
    color: #0A0906;
    margin: 0 0 18px;
  }

  .own-words-hero p {
    font-family: 'Source Serif 4', serif;
    font-size: 18px;
    line-height: 1.55;
    color: #2a2723;
    max-width: 640px;
    margin: 0;
  }

  .own-words-filters {
    max-width: 880px;
    margin: 28px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .own-words-filter-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #2a2723;
    background: none;
    border: 1px solid rgba(10,9,6,0.25);
    padding: 8px 16px;
    cursor: pointer;
  }

  .own-words-filter-btn:hover {
    background: rgba(184,0,0,0.06);
  }

  .own-words-filter-btn.active {
    background: #B80000;
    border-color: #B80000;
    color: #F0EBE1;
  }

  .own-words-list {
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 24px 100px;
  }

  .own-words-card {
    border: 1px solid rgba(10,9,6,0.18);
    background: #F0EBE1;
    margin-bottom: 14px;
  }

  .own-words-card-header {
    width: 100%;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
    text-align: left;
    background: none;
    border: none;
    cursor: pointer;
    padding: 22px 24px;
    font-family: inherit;
  }

  .own-words-card-header:hover {
    background: rgba(184,0,0,0.04);
  }

  .own-words-card-heading {
    flex: 1;
  }

  .own-words-card-person {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 22px;
    color: #0A0906;
    display: block;
  }

  .own-words-card-role {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: #5a544b;
    display: block;
    margin-top: 4px;
  }

  .own-words-card-toggle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    color: #B80000;
    line-height: 1;
    flex-shrink: 0;
    transition: transform 0.2s ease;
  }

  .own-words-card.expanded .own-words-card-toggle {
    transform: rotate(45deg);
  }

  .own-words-card-quote {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 19px;
    line-height: 1.5;
    color: #0A0906;
    padding: 0 24px 22px;
    max-width: 720px;
    border-left: 3px solid #B80000;
    margin: 0 24px 22px;
    padding-left: 18px;
  }

  .own-words-card-body {
    display: none;
    padding: 0 24px 28px;
    border-top: 1px solid rgba(10,9,6,0.12);
  }

  .own-words-card.expanded .own-words-card-body {
    display: block;
  }

  .own-words-section {
    margin-top: 22px;
  }

  .own-words-section h3 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #B80000;
    margin: 0 0 8px;
  }

  .own-words-section p {
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    line-height: 1.65;
    color: #2a2723;
    margin: 0;
    white-space: pre-line;
  }

  .own-words-source {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #5a544b;
    line-height: 1.6;
    margin-top: 22px;
  }

  .own-words-source a {
    color: #B80000;
  }

  .own-words-video {
    margin-top: 22px;
    max-width: 500px;
  }

  .own-words-loading,
  .own-words-error {
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    color: #2a2723;
    padding: 40px 0;
  }

  .own-words-error {
    color: #B80000;
  }

<body>

<nav></nav>
<div class="ticker-wrap"></div>

<main>
  <section class="own-words-hero">
    <div class="eyebrow">In Their Own Words</div>
    <h1>No Interpretation Needed</h1>
    <p>Direct, sourced statements from Hasan Piker and DSA national leadership. Their words, their context, their record.</p>
  </section>

  <div class="own-words-filters" id="own-words-filters">
    <button class="own-words-filter-btn active" data-filter="all">All</button>
    <button class="own-words-filter-btn" data-filter="Hasan Piker">Hasan Piker</button>
    <button class="own-words-filter-btn" data-filter="dsa-leadership">DSA Leadership</button>
  </div>

  <section class="own-words-list" id="own-words-list">
    <div class="own-words-loading" id="own-words-loading">Loading statements…</div>
  </section>
</main>

<footer></footer>

<script src="/components/nav.js"></script>
<script src="/components/ticker.js"></script>
<script src="/components/footer.js"></script>
<script src="/components/search.js"></script>
<script src="https://platform.twitter.com/widgets.js" async></script>

<script>
(function () {
  var listEl = document.getElementById('own-words-list');
  var loadingEl = document.getElementById('own-words-loading');
  var filterBtns = document.querySelectorAll('.own-words-filter-btn');
  var allEntries = [];

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function buildCard(entry, index) {
    var card = document.createElement('div');
    card.className = 'own-words-card';
    card.id = entry.id;
    card.dataset.person = entry.person;

    var header = document.createElement('button');
    header.className = 'own-words-card-header';
    header.setAttribute('aria-expanded', 'false');
    header.innerHTML =
      '<span class="own-words-card-heading">' +
      '<span class="own-words-card-person">' + escapeHtml(entry.person) + '</span>' +
      '<span class="own-words-card-role">' + escapeHtml(entry.role || '') + '</span>' +
      '</span>' +
      '<span class="own-words-card-toggle">+</span>';

    var quote = document.createElement('div');
    quote.className = 'own-words-card-quote';
    quote.textContent = '\u201C' + (entry.quote || '') + '\u201D';

    var body = document.createElement('div');
    body.className = 'own-words-card-body';

    if (entry.context) {
      var section = document.createElement('div');
      section.className = 'own-words-section';
      var h3 = document.createElement('h3');
      h3.textContent = 'Context';
      var p = document.createElement('p');
      p.textContent = entry.context + (entry.date ? ' (' + entry.date + ')' : '');
      section.appendChild(h3);
      section.appendChild(p);
      body.appendChild(section);
    }

    if (entry.video_embed_url) {
      var videoWrap = document.createElement('div');
      videoWrap.className = 'own-words-video';
      var blockquote = document.createElement('blockquote');
      blockquote.className = 'twitter-tweet';
      var a = document.createElement('a');
      a.href = entry.video_embed_url;
      blockquote.appendChild(a);
      videoWrap.appendChild(blockquote);
      body.appendChild(videoWrap);
    }

    if (entry.source_account || entry.source_url) {
      var sourceDiv = document.createElement('div');
      sourceDiv.className = 'own-words-source';
      var sourceText = 'Source: ' + escapeHtml(entry.source_account || '');
      if (entry.source_url && entry.source_url !== 'PASTE_URL_HERE') {
        sourceText += ' — <a href="' + entry.source_url + '" target="_blank" rel="noopener">view source</a>';
      }
      sourceDiv.innerHTML = sourceText;
      body.appendChild(sourceDiv);
    }

    header.addEventListener('click', function () {
      var isExpanded = card.classList.toggle('expanded');
      header.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
      if (isExpanded) {
        history.replaceState(null, '', '#' + entry.id);
        if (window.twttr && window.twttr.widgets) {
          window.twttr.widgets.load(card);
        }
      }
    });

    card.appendChild(header);
    card.appendChild(quote);
    card.appendChild(body);
    return card;
  }

  function render(filter) {
    listEl.innerHTML = '';
    var filtered = allEntries;

    if (filter === 'Hasan Piker') {
      filtered = allEntries.filter(function (e) { return e.person === 'Hasan Piker'; });
    } else if (filter === 'dsa-leadership') {
      filtered = allEntries.filter(function (e) { return e.person !== 'Hasan Piker'; });
    }

    if (filtered.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'own-words-loading';
      empty.textContent = 'No statements in this category yet.';
      listEl.appendChild(empty);
      return;
    }

    filtered.forEach(function (entry, index) {
      listEl.appendChild(buildCard(entry, index));
    });

    var hash = window.location.hash.replace('#', '');
    if (hash) {
      var target = document.getElementById(hash);
      if (target) {
        target.classList.add('expanded');
        target.querySelector('.own-words-card-header').setAttribute('aria-expanded', 'true');
        target.scrollIntoView({ behavior: 'instant', block: 'start' });
        if (window.twttr && window.twttr.widgets) {
          window.twttr.widgets.load(target);
        }
      }
    }
  }

  filterBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      filterBtns.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      render(btn.dataset.filter);
    });
  });

  fetch('/data/own-words.json')
    .then(function (res) {
      if (!res.ok) throw new Error('Failed to load own-words.json');
      return res.json();
    })
    .then(function (entries) {
      loadingEl.remove();

      if (!Array.isArray(entries) || entries.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'own-words-loading';
        empty.textContent = 'No statements available yet.';
        listEl.appendChild(empty);
        return;
      }

      allEntries = entries;
      render('all');
    })
    .catch(function (err) {
      loadingEl.className = 'own-words-error';
      loadingEl.textContent = 'Could not load statement data. (' + err.message + ')';
    });
})();
</script>

</body>
</html>
